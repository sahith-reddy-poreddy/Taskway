name: Deploy

on:
  workflow_run:
    workflows:
      - Build and Publish Docker Image
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Install SSH client
        run: apk add --no-cache openssh-client

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ vars.DEPLOY_SSH_PORT }} ${{ vars.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -i ~/.ssh/id_rsa -p ${{ vars.DEPLOY_SSH_PORT }} ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }} bash << 'EOF'
            DEPLOY_PATH="${{ vars.DEPLOY_PATH }}"
            if [ ! -f "$DEPLOY_PATH/docker-compose.yml" ] && [ ! -f "$DEPLOY_PATH/compose.yml" ]; then
              echo "No docker-compose.yml or compose.yml found in $DEPLOY_PATH"
              exit 1
            fi
            cd "$DEPLOY_PATH"
            docker compose pull
            docker compose up -d --remove-orphans
            echo "Deployment complete"
          EOF
